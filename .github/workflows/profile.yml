name: profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Render profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional fallback. The built-in token already reports private
          # contributions while "include private contributions on my profile"
          # is enabled on the account; a PAT with read:user would be needed
          # only if that setting is ever turned off.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/render.py

      - name: Commit refreshed cards
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"
          git push
